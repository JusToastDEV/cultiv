# Root deploy entrypoint for manual and CI deploys.
# This mirrors the worker config so a plain repo-root `wrangler deploy`
# still deploys the real Worker instead of creating an assets-only script.

name = "cultiv"
main = "./workers/src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./workers/dist"
run_worker_first = true
binding = "ASSETS"

[build]
command = "node ./workers/scripts/build-assets.mjs"

[[d1_databases]]
binding = "DB"
database_name = "sealed-heavens-db"
database_id = "95ec6387-696d-43a8-8887-ffb059c26140"

[[kv_namespaces]]
binding = "SESSIONS"
id = "55129a1f799a4602a7381a47a4fe76eb"

[[kv_namespaces]]
binding = "COOLDOWNS"
id = "152c47e5e7dc4305a15751f1c31cbb83"

[[kv_namespaces]]
binding = "WORLD_TICK"
id = "f4f8cde9e9104c6fbb261ce9168bd685"

[triggers]
crons = ["0 */6 * * *"]