name = "sealed-heavens-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ──────────────────────────────────────────────
# D1 Database
# After running: wrangler d1 create sealed-heavens-db
# paste the returned database_id below
# ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "sealed-heavens-db"
database_id = "95ec6387-696d-43a8-8887-ffb059c26140"

# ──────────────────────────────────────────────
# KV Namespaces
# Run each of these, then paste the returned ids:
#   wrangler kv namespace create SESSIONS
#   wrangler kv namespace create COOLDOWNS
#   wrangler kv namespace create WORLD_TICK
# ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id = "55129a1f799a4602a7381a47a4fe76eb"

[[kv_namespaces]]
binding = "COOLDOWNS"
id = "152c47e5e7dc4305a15751f1c31cbb83"

[[kv_namespaces]]
binding = "WORLD_TICK"
id = "f4f8cde9e9104c6fbb261ce9168bd685"

# ──────────────────────────────────────────────
# Cron triggers
# NPC world tick fires every 6 hours
# ──────────────────────────────────────────────
[triggers]
crons = ["0 */6 * * *"]

# ──────────────────────────────────────────────
# Secrets — set via `wrangler secret put <NAME>`, NOT in this file
# JWT_SECRET           — random 256-bit hex string for signing JWTs
# ADMIN_SETUP_KEY      — one-time key for promoting the first admin account
# ──────────────────────────────────────────────
